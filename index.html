<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 确保在移动端完美缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO与展示优化：给网页一个有意义的标题，而不是默认的 Document -->
    <title>YayAlliance Wiki - 豆芽人联盟</title>
    
    <!-- 引入样式表（建议放在 head 中，避免页面闪烁） -->
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
    <!-- 1. 使用 <nav> 标签代替单纯的 <ul>，对屏幕阅读器和搜索引擎更友好 -->
    <nav class="navbar">
        <!-- Logo/标题区域 -->
        <div class="logo">
            <h3>YayAlliance Wiki</h3>
        </div>
        
        <!-- 导航链接区域 -->
        <ul class="nav-links">
            <li><a href="./index.html" class="active">主页</a></li>
            <li><a href="./pages/wiki.html">Wiki</a></li>
        </ul>
    </nav>

    <!-- 2. 将核心内容包裹在 <main> 标签中，明确页面的主要内容区 -->
    <main class="content-wrapper">
        <!-- 3. 标题层级规范化：大标题用 h1，副标题用 h2，避免直接跳到 h3 -->
        <header class="page-header">
            <h1>欢迎访问豆芽人联盟的 Wiki</h1>
            <p class="subtitle">豆芽人联盟是一个以漫画为主的二次元IP，也是一个充满活力的团队。</p>
        </header>

        <section class="intro-section">
            <h2>第一次了解必看</h2>
            <!-- 新人必读精选：点击直达 Wiki 对应文档 -->
            <div class="quick-links">
                <a class="quick-link" href="./pages/wiki.html?page=../wikimd/1-1/1-1-1.md">
                    <strong>什么是豆芽人联盟</strong>
                    <span>一分钟了解我们是谁</span>
                </a>
                <a class="quick-link" href="./pages/wiki.html?page=../wikimd/1-1/1-1-2.md">
                    <strong>豆芽人联盟发展史</strong>
                    <span>从成立到现在的完整历程</span>
                </a>
                <a class="quick-link" href="./pages/wiki.html?page=../wikimd/1-1/1-1-3.md">
                    <strong>豆芽人联盟的组织结构</strong>
                    <span>团队如何分工与运作</span>
                </a>
                <a class="quick-link" href="./pages/wiki.html?page=../wikimd/1-2/1-2-1.md">
                    <strong>团队体系是什么</strong>
                    <span>五常、五下与星创委员会</span>
                </a>
                <a class="quick-link" href="./pages/wiki.html?page=../wikimd/1-4/1-4-1.md">
                    <strong>世界观介绍</strong>
                    <span>了解漫画背后的故事背景</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
